services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: horizon-trace:latest
    environment:
      # API_PORT 可通过同目录 .env 或 shell 环境变量覆盖，默认 8000。
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # 一次性校验服务：等待 app 健康后依次执行代码测试、镜像构建检查与
  # 联合拾取 API 冒烟，以容器退出码报告结果（0 全部通过）。
  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: horizon-trace:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8000}
      BASE_URL: http://app:${API_PORT:-8000}
    entrypoint: ["sh", "scripts/verify.sh"]
    restart: "no"
